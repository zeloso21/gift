<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선물 고르기</title>
<meta name="description" content="성별, 나이, 예산만 고르면 어울리는 선물 3가지를 골라 드려요.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://zeloso21.github.io/gift/">
<meta property="og:title" content="선물 고르기">
<meta property="og:description" content="성별, 나이, 예산만 고르면 어울리는 선물 3가지를 골라 드려요.">
<meta property="og:image" content="https://zeloso21.github.io/gift/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="선물상자 그림과 '선물 고르기' 글자">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fde3d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a1f1a" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #fdf8f3;
    --dot: #f1e4d6;
    --surface: #ffffff;
    --text: #2e231d;
    --muted: #7c6c61;
    --line: #f0e3d6;
    --accent: #e8683f;
    --accent-deep: #c9502b;
    --accent-ink: #ffffff;
    --accent-soft: #fde9dd;
    --hero-1: #fde3d3;
    --hero-2: #fff1dc;
    --gold: #f2b84b;
    --mint: #dff1e6;
    --mint-ink: #2f6b4a;
    --sky: #e3eefb;
    --sky-ink: #2f557f;
    --note-bg: rgba(255, 255, 255, .55);
    --shadow: 0 2px 4px rgba(120, 70, 40, .05), 0 10px 28px rgba(120, 70, 40, .09);
    --shadow-sm: 0 1px 3px rgba(120, 70, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1613;
      --dot: #2a221d;
      --surface: #261f1b;
      --text: #f4ebe3;
      --muted: #b2a398;
      --line: #3a2f29;
      --accent: #f07f57;
      --accent-deep: #f59a78;
      --accent-ink: #1b1613;
      --accent-soft: #3e2a20;
      --hero-1: #3a2419;
      --hero-2: #2a1f1a;
      --gold: #e2a83c;
      --mint: #22362b;
      --mint-ink: #9fd8b5;
      --sky: #1f2c3b;
      --sky-ink: #a8c8ef;
      --note-bg: rgba(0, 0, 0, .25);
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    word-break: keep-all;
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* 첫 화면 */
  .hero {
    position: relative;
    margin: 0 -16px;
    padding: 0 20px 30px;
    background: linear-gradient(160deg, var(--hero-1) 0%, var(--hero-2) 100%);
    border-radius: 0 0 28px 28px;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .hero::before { width: 180px; height: 180px; right: -60px; top: 40px; background: var(--accent); opacity: .12; }
  .hero::after { width: 90px; height: 90px; left: -30px; bottom: -30px; background: var(--gold); opacity: .18; }
  .disclosure {
    position: relative;
    margin: 0 -20px 12px;
    padding: 8px 20px;
    background: var(--note-bg);
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .search { position: relative; margin: 0 0 12px; }
  .search iframe { display: block; width: 100%; height: 75px; border: 0; }
  .hero-body { position: relative; display: flex; align-items: center; gap: 14px; }
  .hero-text { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.03em; font-weight: 800; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
  .gift-art { flex: 0 0 auto; width: 80px; height: 80px; }
  @media (prefers-reduced-motion: no-preference) {
    .gift-art { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
  }

  /* 질문 */
  .questions {
    position: relative;
    margin-top: -16px;
    padding: 4px 16px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .q { margin: 0; padding: 14px 0 16px; border: 0; min-width: 0; }
  .q + .q { border-top: 1px dashed var(--line); }
  .q legend {
    float: left;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0;
    margin-bottom: 10px;
    font-weight: 800;
    font-size: 16px;
  }
  .q legend + * { clear: both; }
  .step {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-size: 13px;
    font-weight: 800;
    transition: background .2s, color .2s;
  }
  .q.done .step { background: var(--accent); color: var(--accent-ink); }
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .chips[data-key="age"] { grid-template-columns: repeat(3, 1fr); }
  .chip {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 0;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 8px 10px;
    min-height: 44px;
    border-radius: 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .chip .ico { font-size: 17px; line-height: 1; }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(232, 104, 63, .3);
  }
  .chip .count { font-size: 12px; font-weight: 600; opacity: .7; }
  /* 지금 조건으로 맞는 상품이 없는 칩: 누를 수는 있지만 흐리게 */
  .chip.none:not([aria-pressed="true"]) { opacity: .5; border-style: dashed; }
  .chip:focus-visible, .sort:focus-visible, .btn:focus-visible, .more:focus-visible, .share:focus-visible, summary:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }

  /* 결과 */
  #results { margin-top: 30px; scroll-margin-top: 12px; }
  .empty {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    padding: 18px;
    border: 1.5px dashed var(--line);
    border-radius: 18px;
    color: var(--muted);
    font-size: 15px;
    background: var(--surface);
  }
  .empty .ico { font-size: 26px; }
  .results-head { margin: 0 0 12px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .results-head small { margin-left: 6px; color: var(--muted); font-size: 14px; font-weight: 500; }
  /* 정렬 버튼 줄 */
  .sortbar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 2px;
    margin: 0 0 14px;
    padding: 3px;
    border-radius: 14px;
    background: var(--line);
  }
  .sort {
    appearance: none;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 2px;
    min-height: 38px;
    border-radius: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .sort:hover { color: var(--text); }
  .sort[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .group-head {
    margin: 6px 2px -4px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 800;
  }
  .group-head:first-child { margin-top: 0; }
  .relaxed {
    display: flex;
    gap: 8px;
    margin: 0 0 14px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-radius: 14px;
    font-size: 14px;
  }
  .relaxed strong { display: block; font-weight: 800; color: var(--accent-deep); }

  .list { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .card {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  @media (prefers-reduced-motion: no-preference) {
    #results .card { animation: rise .45s cubic-bezier(.2, .7, .3, 1) both; }
    #results .card:nth-child(2) { animation-delay: .07s; }
    #results .card:nth-child(3) { animation-delay: .14s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  }
  /* 파트너스 배너: 원본 비율(240×480) 그대로, 자르거나 덮지 않음 */
  .banner {
    flex: 0 0 auto;
    align-self: flex-start;
    display: block;
    box-sizing: content-box;
    width: 110px;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: var(--shadow-sm);
  }
  .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .eyebrow { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .rank {
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 12px;
    font-weight: 800;
  }
  .info h3 { margin: 0 0 6px; font-size: 17px; line-height: 1.35; letter-spacing: -0.01em; }
  .reason { margin: 0 0 10px; font-size: 14.5px; color: var(--text); }
  .fit { margin: 0 0 10px; font-size: 13px; color: var(--mint-ink); font-weight: 600; }
  .price { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .price b { display: block; color: var(--text); font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .btn {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(232, 104, 63, .25);
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--accent-deep); }
  .btn:active { transform: scale(.97); }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .more, .share {
    appearance: none;
    flex: 1;
    min-height: 46px;
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .more:hover, .share:hover { border-color: var(--accent); }
  .more:active, .share:active { transform: scale(.97); }
  .share { color: var(--accent-deep); }
  /* 링크 복사 알림: 잠깐(3초) 떴다가 사라짐 */
  .copied {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 528px;
    padding: 16px 18px;
    border-radius: 16px;
    background: var(--text);
    color: var(--bg);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .25);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 12px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .copied.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  /* 복사가 막힌 곳: 주소 칸을 길게 눌러 직접 복사 */
  .copybox {
    margin-top: 10px;
    padding: 12px 14px 14px;
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    background: var(--surface);
  }
  .copybox p { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
  .copybox input {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    -webkit-user-select: all;
    user-select: all;
  }

  /* 전체 보기 */
  .all {
    margin-top: 32px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .all summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    cursor: pointer;
    font-weight: 800;
    list-style: none;
  }
  .all summary::-webkit-details-marker { display: none; }
  .all summary::after {
    content: "";
    width: 9px;
    height: 9px;
    border-right: 2.5px solid var(--muted);
    border-bottom: 2.5px solid var(--muted);
    transform: rotate(45deg) translateY(-3px);
    transition: transform .2s;
  }
  .all[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
  .all summary small { margin-left: 6px; color: var(--muted); font-weight: 500; }
  .all .sortbar { margin: 0 12px 12px; }
  .all .list { padding: 0 12px 12px; }
  .all .card { box-shadow: none; background: var(--bg); }

  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 12.5px; }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <p class="disclosure">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    <div class="search">
      <iframe src="https://coupa.ng/cqq84P" width="100%" height="75" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" title="쿠팡 상품 검색"></iframe>
    </div>
    <div class="hero-body">
      <div class="hero-text">
        <h1>선물 고르기</h1>
        <p class="sub">성별, 나이, 예산만 고르면 어울리는 선물을 골라 드려요.</p>
      </div>
      <svg class="gift-art" viewBox="0 0 96 96" aria-hidden="true">
        <rect x="14" y="40" width="68" height="46" rx="8" fill="#e8683f"/>
        <rect x="8" y="28" width="80" height="18" rx="6" fill="#f07f57"/>
        <rect x="42" y="28" width="12" height="58" fill="#f2b84b"/>
        <rect x="14" y="46" width="68" height="5" fill="#000" opacity=".08"/>
        <path d="M48 28c-6-14-24-18-26-8s14 10 26 8z" fill="none" stroke="#f2b84b" stroke-width="6" stroke-linejoin="round"/>
        <path d="M48 28c6-14 24-18 26-8s-14 10-26 8z" fill="none" stroke="#f2b84b" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="48" cy="28" r="5" fill="#f2b84b"/>
      </svg>
    </div>
  </header>

  <form class="questions" id="questions" onsubmit="return false">
    <fieldset class="q">
      <legend><span class="step">1</span>성별은요?</legend>
      <div class="chips" data-key="gender">
        <button type="button" class="chip" data-value="male" aria-pressed="false"><span class="ico" aria-hidden="true">👨</span>남성</button>
        <button type="button" class="chip" data-value="female" aria-pressed="false"><span class="ico" aria-hidden="true">👩</span>여성</button>
      </div>
    </fieldset>
    <fieldset class="q">
      <legend><span class="step">2</span>몇 살쯤인가요?</legend>
      <div class="chips" data-key="age">
        <button type="button" class="chip" data-value="kids" aria-pressed="false">아이</button>
        <button type="button" class="chip" data-value="10s" aria-pressed="false">10대</button>
        <button type="button" class="chip" data-value="20s" aria-pressed="false">20대</button>
        <button type="button" class="chip" data-value="30s" aria-pressed="false">30대</button>
        <button type="button" class="chip" data-value="40s" aria-pressed="false">40대</button>
        <button type="button" class="chip" data-value="50plus" aria-pressed="false">50대 이상</button>
      </div>
    </fieldset>
    <fieldset class="q">
      <legend><span class="step">3</span>예산은 얼마쯤?</legend>
      <div class="chips" data-key="budget">
        <button type="button" class="chip" data-value="b1" aria-pressed="false">2만 원 이하</button>
        <button type="button" class="chip" data-value="b2" aria-pressed="false">2~5만 원</button>
        <button type="button" class="chip" data-value="b3" aria-pressed="false">5~10만 원</button>
        <button type="button" class="chip" data-value="b4" aria-pressed="false">10만 원 이상</button>
      </div>
    </fieldset>
  </form>

  <section id="results" aria-live="polite"></section>

  <details class="all" id="all">
    <summary><span>전체 선물 보기<small id="all-count"></small></span></summary>
    <div class="sortbar" id="all-sort" role="group" aria-label="전체 선물 정렬"></div>
    <ul class="list" id="all-list"></ul>
  </details>

  <footer>
    <p>가격은 수집일 기준 대략적인 금액이에요. 구매 전에 쿠팡에서 꼭 확인해 주세요.</p>
    <p>이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var BUDGETS = {
    b1: { label: '2만 원 이하', test: function (p) { return p <= 20000; } },
    b2: { label: '2~5만 원', test: function (p) { return p > 20000 && p <= 50000; } },
    b3: { label: '5~10만 원', test: function (p) { return p > 50000 && p <= 100000; } },
    b4: { label: '10만 원 이상', test: function (p) { return p > 100000; } }
  };
  var NAMES = { gender: '성별', age: '연령대', budget: '예산' };
  // products.json의 category 값 → 화면 이름 (이 순서대로 묶어 보여 줌, 없거나 모르는 값은 '기타')
  var CATEGORIES = { food: '먹거리', beauty: '뷰티', living: '생활·리빙', digital: '디지털', fashion: '패션·잡화', hobby: '취미·놀이' };
  var CAT_ORDER = Object.keys(CATEGORIES).concat('etc');
  var SORTS = { rec: '추천순', low: '낮은 가격순', high: '높은 가격순', cat: '카테고리별' };
  var ALL_SORTS = ['cat', 'low', 'high'];
  var GENDER = { male: '남성', female: '여성' };
  var AGE = { kids: '아이', '10s': '10대', '20s': '20대', '30s': '30대', '40s': '40대', '50plus': '50대 이상' };
  // 맞는 게 없을 때 먼저 푸는 조건 순서
  var RELAX_ORDER = ['gender', 'age', 'budget'];
  var MAX = 3;
  var VALID = { gender: GENDER, age: AGE, budget: BUDGETS };

  var products = [];
  var loaded = false;
  var state = { gender: null, age: null, budget: null };
  var shownMax = MAX;
  var sortMode = 'rec';
  var allSort = 'cat';
  var results = document.getElementById('results');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  function priceText(p) {
    if (p < 10000) return '약 1만 원 미만';
    return '약 ' + Math.floor(p / 10000) + '만 원대';
  }

  function dateText(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? Number(m[2]) + '월 ' + Number(m[3]) + '일 기준' : '수집일 기준';
  }

  function catOf(p) { return CATEGORIES[p.category] ? p.category : 'etc'; }
  function catName(p) { return CATEGORIES[p.category] || '기타'; }

  function card(p, rank) {
    var li = el('li', { 'class': 'card' });
    var img = el('img', {
      'class': 'banner', src: p.image, alt: p.short + ' 상품 이미지',
      width: '240', height: '480', loading: 'lazy', decoding: 'async'
    });
    li.appendChild(img);

    var info = el('div', { 'class': 'info' });
    var eyebrow = el('p', { 'class': 'eyebrow' });
    if (rank) eyebrow.appendChild(el('span', { 'class': 'rank' }, '추천 ' + rank));
    eyebrow.appendChild(el('span', {}, catName(p)));
    info.appendChild(eyebrow);
    info.appendChild(el('h3', {}, p.short));
    info.appendChild(el('p', { 'class': 'reason' }, p.reason));

    var fit = [];
    // 성별은 한쪽에만 맞는 상품일 때만 태그로 보여 준다
    if (p.gender && p.gender.length === 1 && GENDER[p.gender[0]]) fit.push(GENDER[p.gender[0]]);
    (p.age || []).forEach(function (a) { if (AGE[a]) fit.push(AGE[a]); });
    if (fit.length) info.appendChild(el('p', { 'class': 'fit' }, '✓ ' + fit.join(' · ')));

    var price = el('p', { 'class': 'price' });
    price.appendChild(el('b', {}, priceText(p.price)));
    price.appendChild(document.createTextNode(dateText(p.collected) + ', 구매 전 확인'));
    info.appendChild(price);

    info.appendChild(el('a', {
      'class': 'btn', href: p.link, target: '_blank', rel: 'sponsored noopener'
    }, '쿠팡에서 보기 →'));
    li.appendChild(info);
    return li;
  }

  function matches(p, keys, s) {
    s = s || state;
    return keys.every(function (k) {
      var v = s[k];
      if (k === 'budget') return BUDGETS[v].test(p.price);
      // 성별(gender)·연령대(age)를 아직 안 적은 상품은 모두에게 맞는 걸로 본다
      if ((k === 'gender' || k === 'age') && !(p[k] && p[k].length)) return true;
      return (p[k] || []).indexOf(v) !== -1;
    });
  }

  // 고른 예산 구간에서 얼마나 떨어져 있는지 (원)
  function budgetGap(price, b) {
    var lo = { b1: 0, b2: 20001, b3: 50001, b4: 100001 }[b];
    var hi = { b1: 20000, b2: 50000, b3: 100000, b4: Infinity }[b];
    return price < lo ? lo - price : price > hi ? price - hi : 0;
  }

  // 추천 순서: 고른 조건에 좁게 딱 맞을수록 위로, 집들이 전용 상품은 아래로
  function score(p, dropped) {
    var s = 0;
    if (state.gender && dropped.indexOf('gender') === -1 &&
        p.gender && p.gender.length === 1 && p.gender[0] === state.gender) s += 3;
    if (state.age && dropped.indexOf('age') === -1 && p.age && p.age.indexOf(state.age) !== -1) {
      s += 1 + 2 / p.age.length;
    }
    var occ = p.occasion || [];
    if (occ.length === 1 && occ[0] === 'housewarming') s -= 5;
    // 예산 조건을 뺐을 땐 고른 예산에 가까운 상품부터
    if (state.budget && dropped.indexOf('budget') !== -1) s -= budgetGap(p.price, state.budget) / 5000;
    return s;
  }

  function rank(list, dropped) {
    return list
      .map(function (p, i) { return { p: p, i: i, s: score(p, dropped) }; })
      // 점수가 같으면 싼 상품부터
      .sort(function (a, b) { return b.s - a.s || a.p.price - b.p.price || a.i - b.i; })
      .map(function (x) { return x.p; });
  }

  // 정렬: list는 이미 기본 순서(추천순)로 놓여 있고, 같은 값끼리는 그 순서를 지킨다
  function arrange(list, mode) {
    if (mode === 'rec') return list;
    return list
      .map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) {
        var d = mode === 'low' ? a.p.price - b.p.price
          : mode === 'high' ? b.p.price - a.p.price
          : CAT_ORDER.indexOf(catOf(a.p)) - CAT_ORDER.indexOf(catOf(b.p));
        return d || a.i - b.i;
      })
      .map(function (x) { return x.p; });
  }

  // 카드 목록 채우기 (카테고리별이면 카테고리 이름으로 묶음, 추천순일 때만 '추천 N' 표시)
  function fillList(ul, list, mode, numbered) {
    var last = null;
    list.forEach(function (p, i) {
      if (mode === 'cat' && catOf(p) !== last) {
        last = catOf(p);
        ul.appendChild(el('li', { 'class': 'group-head' }, catName(p)));
      }
      ul.appendChild(card(p, numbered && mode === 'rec' ? i + 1 : 0));
    });
  }

  // 정렬 버튼을 bar 안에 채운다. 누르면 다시 그린 뒤 같은 버튼에 포커스를 돌려준다
  function fillSortBar(bar, modes, current, onPick) {
    bar.innerHTML = '';
    modes.forEach(function (m) {
      var b = el('button', { type: 'button', 'class': 'sort', 'data-value': m, 'aria-pressed': String(m === current) }, SORTS[m]);
      b.addEventListener('click', function () {
        onPick(m);
        // 결과 쪽 정렬 줄은 다시 그려지며 새로 만들어진다
        var again = bar.isConnected ? bar : results.querySelector('.sortbar');
        var btn = again && again.querySelector('.sort[data-value="' + m + '"]');
        if (btn) btn.focus({ preventScroll: true });
      });
      bar.appendChild(b);
    });
  }

  function renderAll() {
    var ul = document.getElementById('all-list');
    fillSortBar(document.getElementById('all-sort'), ALL_SORTS, allSort, function (m) {
      allSort = m;
      renderAll();
    });
    ul.innerHTML = '';
    fillList(ul, arrange(products, allSort), allSort, false);
  }

  // 고른 조건의 부분집합을 많이 남기는 순서로 (푸는 조건은 RELAX_ORDER 우선)
  function relaxations(keys) {
    var out = [];
    var drop = RELAX_ORDER.filter(function (k) { return keys.indexOf(k) !== -1; });
    for (var n = 1; n <= drop.length; n++) {
      (function pick(start, chosen) {
        if (chosen.length === n) { out.push(chosen.slice()); return; }
        for (var i = start; i < drop.length; i++) pick(i + 1, chosen.concat(drop[i]));
      })(0, []);
    }
    return out;
  }

  function empty(icon, text) {
    var p = el('p', { 'class': 'empty' });
    p.appendChild(el('span', { 'class': 'ico', 'aria-hidden': 'true' }, icon));
    p.appendChild(document.createTextNode(text));
    return p;
  }

  function render() {
    var keys = Object.keys(state).filter(function (k) { return state[k]; });
    results.innerHTML = '';
    if (!keys.length) {
      results.appendChild(empty('🎁', '위에서 하나라도 고르면 바로 여기에 선물이 나와요.'));
      return;
    }
    if (!loaded) {
      results.appendChild(empty('🎁', '선물 목록을 불러오는 중이에요…'));
      return;
    }

    var found = products.filter(function (p) { return matches(p, keys); });
    var dropped = [];
    if (!found.length) {
      var tries = relaxations(keys);
      for (var i = 0; i < tries.length && !found.length; i++) {
        var keep = keys.filter(function (k) { return tries[i].indexOf(k) === -1; });
        found = products.filter(function (p) { return matches(p, keep); });
        if (found.length) dropped = tries[i];
      }
    }

    if (!found.length) {
      results.appendChild(empty('🔎', '아직 맞는 선물이 없어요. 아래 전체 선물을 둘러봐 주세요.'));
      return;
    }

    found = arrange(rank(found, dropped), sortMode);
    var shown = found.slice(0, shownMax);
    var head = el('h2', { 'class': 'results-head' }, '이런 선물 어때요?');
    head.appendChild(el('small', {}, found.length > shown.length
      ? found.length + '가지 중 ' + shown.length + '가지' : shown.length + '가지'));
    results.appendChild(head);
    if (found.length > 1) {
      var bar = el('div', { 'class': 'sortbar', role: 'group', 'aria-label': '추천 선물 정렬' });
      fillSortBar(bar, ['rec', 'low', 'high', 'cat'], sortMode, function (m) {
        sortMode = m;
        saveToUrl();
        render();
      });
      results.appendChild(bar);
    }

    if (dropped.length) {
      var note = el('div', { 'class': 'relaxed' });
      note.appendChild(el('span', { 'aria-hidden': 'true' }, '💡'));
      var txt = el('p', { style: 'margin:0' });
      txt.appendChild(el('strong', {}, '조건을 넓혀 찾았어요'));
      txt.appendChild(document.createTextNode(
        "딱 맞는 선물이 없어서 '" + dropped.map(function (k) { return NAMES[k]; }).join("', '") + "' 조건은 빼고 골랐어요."
      ));
      note.appendChild(txt);
      results.appendChild(note);
    }

    var ul = el('ul', { 'class': 'list' });
    fillList(ul, shown, sortMode, true);
    results.appendChild(ul);

    var actions = el('div', { 'class': 'actions' });
    var rest = found.length - shown.length;
    if (rest > 0) {
      var more = el('button', { type: 'button', 'class': 'more' }, '더 보기 (' + rest + '개 더)');
      more.addEventListener('click', function () {
        shownMax += MAX;
        render();
        // 새로 나온 첫 카드로 포커스를 옮겨 이어서 볼 수 있게
        var next = results.querySelectorAll('.card')[shown.length];
        if (next) {
          var link = next.querySelector('a');
          if (link) link.focus({ preventScroll: true });
          next.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
        }
      });
      actions.appendChild(more);
    }
    // 공유 창이 없는 곳(인스타·카톡 앱 안 브라우저, PC 등)에선 '링크 복사하기'
    var share = el('button', { type: 'button', 'class': 'share' },
      navigator.share ? '이 결과 공유하기' : '링크 복사하기');
    share.addEventListener('click', shareResult);
    actions.appendChild(share);
    results.appendChild(actions);
  }

  var copiedTimer;
  function showCopied() {
    var t = document.getElementById('copied');
    if (!t) {
      t = el('p', { 'class': 'copied', id: 'copied', role: 'status' });
      document.body.appendChild(t);
    }
    t.textContent = '✅ 링크를 복사했어요. 카톡 대화창에 붙여 넣으세요';
    t.classList.add('show');
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  function showCopyBox(url) {
    var box = results.querySelector('.copybox');
    if (!box) {
      box = el('div', { 'class': 'copybox' });
      box.appendChild(el('p', {}, '아래 주소를 길게 눌러 복사해 주세요'));
      var input = el('input', { type: 'text', readonly: '', 'aria-label': '이 결과 주소' });
      input.addEventListener('focus', function () { input.select(); });
      box.appendChild(input);
      results.appendChild(box);
    }
    var field = box.querySelector('input');
    field.value = url;
    field.focus();
    field.select();
  }

  // 클립보드 API가 막힌 앱 안 브라우저용 예전 방식
  function legacyCopy(text) {
    var ta = el('textarea', { readonly: '', style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyLink(url) {
    function fallback() {
      if (legacyCopy(url)) showCopied();
      else showCopyBox(url);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(showCopied, fallback);
    } else {
      fallback();
    }
  }

  function shareResult() {
    var url = location.href;
    var parts = [];
    if (state.age) parts.push(AGE[state.age]);
    if (state.gender) parts.push(GENDER[state.gender]);
    if (state.budget) parts.push(BUDGETS[state.budget].label);
    var text = parts.join(' · ') + ' 선물 추천';
    if (navigator.share) {
      navigator.share({ title: '선물 고르기', text: text, url: url }).catch(function (e) {
        // 사용자가 공유 창을 닫은 게 아니라 막힌 거면 링크 복사로
        if (!e || e.name !== 'AbortError') copyLink(url);
      });
      return;
    }
    copyLink(url);
  }

  // 고른 조건을 주소(?gender=&age=&budget=)에 남겨 공유·새로고침해도 그대로
  function saveToUrl() {
    if (!window.history || !history.replaceState) return;
    var q = Object.keys(state).filter(function (k) { return state[k]; })
      .map(function (k) { return k + '=' + encodeURIComponent(state[k]); });
    if (sortMode !== 'rec') q.push('sort=' + sortMode);
    q = q.join('&');
    history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
  }

  function loadFromUrl() {
    var m, re = /[?&](gender|age|budget|sort)=([^&#]*)/g;
    while ((m = re.exec(location.search))) {
      var v = decodeURIComponent(m[2]);
      if (m[1] === 'sort') {
        if (SORTS.hasOwnProperty(v)) sortMode = v;
        continue;
      }
      if (VALID[m[1]].hasOwnProperty(v)) state[m[1]] = v;
    }
  }

  function syncChips() {
    document.querySelectorAll('.chips').forEach(function (group) {
      var key = group.getAttribute('data-key');
      group.querySelectorAll('.chip').forEach(function (c) {
        c.setAttribute('aria-pressed', String(c.getAttribute('data-value') === state[key]));
      });
      var q = group.closest('.q');
      q.classList.toggle('done', !!state[key]);
    });
  }

  // 예산 칩마다, 지금 고른 성별·연령대로 맞는 상품이 몇 개인지
  function updateCounts() {
    var keys = ['gender', 'age'].filter(function (k) { return state[k]; });
    document.querySelectorAll('.chips[data-key="budget"] .chip').forEach(function (c) {
      var s = { gender: state.gender, age: state.age, budget: c.getAttribute('data-value') };
      var n = products.filter(function (p) { return matches(p, keys.concat('budget'), s); }).length;
      var span = c.querySelector('.count');
      if (!span) {
        span = el('span', { 'class': 'count' });
        c.appendChild(span);
      }
      span.textContent = n + '개';
      c.classList.toggle('none', n === 0);
    });
  }

  document.querySelectorAll('.chips').forEach(function (group) {
    var key = group.getAttribute('data-key');
    group.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      var value = chip.getAttribute('data-value');
      var wasDone = state.gender && state.age && state.budget;
      state[key] = state[key] === value ? null : value;
      shownMax = MAX;
      syncChips();
      saveToUrl();
      if (products.length) updateCounts();
      render();
      // 세 질문을 다 고른 순간, 결과가 화면 아래에 있으면 내려 준다
      if (!wasDone && state.gender && state.age && state.budget &&
          results.getBoundingClientRect().top > window.innerHeight * 0.6) {
        results.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      }
    });
  });

  loadFromUrl();
  saveToUrl();
  syncChips();
  render();

  fetch('products.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (data) {
      products = Array.isArray(data) ? data : [];
      loaded = true;
      renderAll();
      document.getElementById('all-count').textContent = products.length + '개';
      updateCounts();
      render();
    })
    .catch(function () {
      results.innerHTML = '';
      results.appendChild(empty('😥', '선물 목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.'));
    });
})();
</script>
</body>
</html>
